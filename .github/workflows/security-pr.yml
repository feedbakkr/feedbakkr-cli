name: Security PR Check

on:
  pull_request:
    branches: [main]

# Minimal permissions — this workflow only reads the repo and reports back via
# the standard checks API.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci

      # Blocking on high+ severity. The initial rollout had 0 unmitigated highs
      # (cleared via `npm audit fix` before this workflow landed), so blocking
      # from day one is safe.
      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high
